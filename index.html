<canvas id="effectsCanvas"></canvas>

<div class="login-card">

<div id="successOverlay">

<script>
// 1. Canvas Hiệu ứng Pháo hoa
const canvas = document.getElementById('effectsCanvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

let particles = [];
const colors = ['#ff5e00', '#ffaa00', '#00e676', '#00b0ff', '#ff0055', '#e040fb', '#ffff00'];

class Particle {
    constructor(x, y, color) {
        this.x = x; this.y = y; this.color = color;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 8 + 2;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.alpha = 1;
        this.decay = Math.random() * 0.03 + 0.015;
        this.gravity = 0.12;
    }
    update() {
        this.vx *= 0.96; this.vy *= 0.96;
        this.vy += this.gravity;
        this.x += this.vx; this.y += this.vy;
        this.alpha -= this.decay;
    }
    draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(this.alpha, 0);
        ctx.beginPath();
        ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
        ctx.restore();
    }
}

function launchFireworks() {
    const x = Math.random() * canvas.width;
    const y = Math.random() * (canvas.height * 0.5);
    for (let i = 0; i < 60; i++) {
        particles.push(new Particle(x, y, colors[Math.floor(Math.random() * colors.length)]));
    }
}

function animate() {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        particles[i].draw();
        if (particles[i].alpha <= 0) particles.splice(i, 1);
    }
    requestAnimationFrame(animate);
}
animate();

setInterval(() => { if (Math.random() > 0.6) launchFireworks(); }, 1200);

// 2. Hàm hỗ trợ đọc tên tiếng Việt thành Email
function removeAccents(str) {
    if (!str) return '';
    return str.normalize('NFD')
              .replace(/[\u0300-\u036f]/g, '')
              .replace(/đ/g, 'd').replace(/Đ/g, 'D')
              .toLowerCase().trim();
}

function generateSmartEmail(fullName) {
    if (!fullName || !fullName.trim()) return '';
    const cleanStr = removeAccents(fullName).replace(/[^a-z0-9\s]/g, '');
    const parts = cleanStr.split(/\s+/);
    if (parts.length === 0) return '';
    if (parts.length === 1) return parts[0] + '@thandong.com';

    const lastName = parts[parts.length - 1];
    let initials = '';
    for (let i = 0; i < parts.length - 1; i++) initials += parts[i].charAt(0);
    return (lastName + initials + '@thandong.com');
}

// 3. Khởi tạo & Lấy toàn bộ danh sách tài khoản hợp lệ từ localStorage
function getAllValidAccounts() {
    const accountList = [];

    // Danh sách mật khẩu hợp lệ cho Admin
    const adminPasswords = ['Rich@2007', 'Thandong@123', '123456'];
    adminPasswords.forEach(pass => {
        accountList.push({
            email: 'admin@thandong.com',
            code: 'ADMIN',
            pass: pass,
            role: 'admin',
            name: 'Quản trị viên Admin'
        });
    });

    // Danh sách Giáo Viên do Admin khởi tạo
    const gvList = JSON.parse(localStorage.getItem('giaoVienList')) || [];
    gvList.forEach(g => {
        accountList.push({
            email: g.mail || generateSmartEmail(g.ten),
            code: g.ma,
            pass: g.pass || '123456',
            role: 'giaovien',
            name: g.ten,
            ma: g.ma
        });
    });

    // Danh sách Học Sinh do Admin khởi tạo
    const hsList = JSON.parse(localStorage.getItem('hocSinhList')) || [];
    hsList.forEach(h => {
        accountList.push({
            email: h.mail || generateSmartEmail(h.ten),
            code: h.ma,
            pass: h.pass || '123456',
            role: 'hocsinh',
            name: h.ten,
            ma: h.ma
        });
    });

    return accountList;
}

// 4. Xử lý Đăng Nhập & Chuyển Trang Đúng Vai Trò
document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const inputUser = document.getElementById('email').value.trim().toLowerCase();
    const inputPass = document.getElementById('password').value.trim();
    const alertBox = document.getElementById('alertBox');

    const accounts = getAllValidAccounts();
    const matchedUser = accounts.find(acc => 
        (acc.email.toLowerCase() === inputUser || acc.code.toLowerCase() === inputUser) && acc.pass === inputPass
    );

    if (matchedUser) {
        // LƯU CHÍNH XÁC THÔNG TIN NGƯỜI DÙNG VỪA ĐĂNG NHẬP VÀO LOCALSTORAGE
        localStorage.setItem('currentUser', JSON.stringify(matchedUser));
        alertBox.classList.add('d-none');

        document.getElementById('welcomeMsg').textContent = `Xin chào ${matchedUser.name}!`;
        document.getElementById('successOverlay').classList.add('active');

        for (let i = 0; i < 5; i++) setTimeout(launchFireworks, i * 150);

        confetti({
            particleCount: 120,
            spread: 100,
            origin: { y: 0.6 },
            colors: ['#ff5e00', '#00e676', '#ffaa00', '#ff0055', '#00b0ff']
        });

        // Chuyển trang đúng file của từng người sau 1s
        setTimeout(() => {
            if (matchedUser.role === 'admin') {
                window.location.href = 'adminhs.html';
            } else if (matchedUser.role === 'giaovien') {
                window.location.href = 'giaovienhs.html';
            } else if (matchedUser.role === 'hocsinh') {
                window.location.href = 'hocsinh.html';
            } else {
                window.location.href = 'adminhs.html';
            }
        }, 1000);

    } else {
        alertBox.textContent = 'Mật khẩu, email hoặc mã số không chính xác!';
        alertBox.classList.remove('d-none');
    }
});
</script>
